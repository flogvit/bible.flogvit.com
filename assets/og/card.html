<!doctype html>
<!--
  KILDEN til delekortet (#65). `bun scripts/generate-og-card.ts` rendrer denne
  fila i headless Chrome og skriver `public/og.png`.

  Verdiene under er kopiert fra `portal/STYLE.md` — det er slik familien deler
  identitet (ingen delt pakke, ingen designsystem: kopiér verdiene inn). Endres
  aksenten eller papiret der, endres de her, og kortet genereres på nytt.

  Wordmarken er ellers ALDRI et bilde (STYLE.md), fordi den også er navigasjon.
  Et delekort er det ene stedet den ikke kan være tekst: en skraper viser et
  bilde eller ingenting.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: 'Schibsted Grotesk';
        font-weight: 400 800;
        src: url(fonts/schibsted-grotesk-latin.woff2) format('woff2');
      }
      @font-face {
        font-family: 'IBM Plex Mono';
        font-weight: 500;
        src: url(fonts/plex-mono-latin.woff2) format('woff2');
      }

      :root {
        --paper: #faf9f6;   /* nøytral, lys (familie) */
        --ink: #1b1b18;
        --ink-2: #67665f;
        --accent: #7a4a21;  /* lær — bibels aksent, «skinnperm» */
      }

      * { margin: 0; padding: 0; box-sizing: border-box; }

      body {
        width: 1200px;
        height: 630px;
        background: var(--paper);
        color: var(--ink);
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 0 96px;
        /* Ingen antialias-overstyring: standarden er det leseren ser i
           kortet hos Slack og Facebook. */
      }

      .wordmark {
        display: flex;
        align-items: baseline;
        font-size: 104px;
        line-height: 1;
        white-space: nowrap;
      }
      .brand {
        font-family: 'Schibsted Grotesk';
        font-weight: 800;
        letter-spacing: -0.02em;
      }
      .dot {
        font-family: 'Schibsted Grotesk';
        font-weight: 800;
        color: var(--accent);
      }
      .product {
        font-family: 'IBM Plex Mono';
        font-weight: 500;
        font-size: 0.95em;
      }

      .domain {
        margin-top: 40px;
        font-family: 'IBM Plex Mono';
        font-weight: 500;
        font-size: 32px;
        letter-spacing: 0.01em;
        color: var(--ink-2);
      }

      /* Prikken nede til høyre er familiesignaturen — portalens kort har én
         per produkt, et produktkort har sin egen. */
      .mark {
        position: absolute;
        right: 96px;
        bottom: 88px;
        width: 32px;
        height: 32px;
        border-radius: 999px;
        background: var(--accent);
      }
    </style>
  </head>
  <body>
    <div class="wordmark">
      <span class="brand">FLOGVIT</span><span class="dot">.</span><span class="product">bible</span>
    </div>
    <p class="domain">bible.flogvit.com</p>
    <span class="mark"></span>
  </body>
</html>

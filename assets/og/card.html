<!doctype html>
<!--
  KILDEN til delekortet (#65). `bun scripts/generate-og-card.ts` rendrer denne
  fila i headless Chrome og skriver `public/og.png`.

  Verdiene under er kopiert fra `portal/STYLE.md` — det er slik familien deler
  identitet (ingen delt pakke, ingen designsystem: kopiér verdiene inn). Endres
  aksenten eller papiret der, endres de her, og kortet genereres på nytt.

  Wordmarken er ellers ALDRI et bilde (STYLE.md), fordi den også er navigasjon.
  Et delekort er det ene stedet den ikke kan være tekst: en skraper viser et
  bilde eller ingenting.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: 'Schibsted Grotesk';
        font-weight: 400 800;
        src: url(fonts/schibsted-grotesk-latin.woff2) format('woff2');
      }
      @font-face {
        font-family: 'IBM Plex Mono';
        font-weight: 500;
        src: url(fonts/plex-mono-latin.woff2) format('woff2');
      }

      :root {
        --paper: #faf9f6;   /* nøytral, lys (familie) */
        --ink: #1b1b18;
        --ink-2: #67665f;
        --accent: #7a4a21;  /* lær — bibels aksent, «skinnperm» */
      }

      * { margin: 0; padding: 0; box-sizing: border-box; }

      body {
        width: 1200px;
        height: 630px;
        background: var(--paper);
        color: var(--ink);
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 0 96px;
        /* Ingen antialias-overstyring: standarden er det leseren ser i
           kortet hos Slack og Facebook. */
      }

      .wordmark {
        display: flex;
        align-items: baseline;
        font-size: 104px;
        line-height: 1;
        white-space: nowrap;
      }
      .brand {
        font-family: 'Schibsted Grotesk';
        font-weight: 800;
        letter-spacing: -0.02em;
      }
      .dot {
        font-family: 'Schibsted Grotesk';
        font-weight: 800;
        color: var(--accent);
      }
      .product {
        font-family: 'IBM Plex Mono';
        font-weight: 500;
        font-size: 0.95em;
      }

      .domain {
        margin-top: 40px;
        font-family: 'IBM Plex Mono';
        font-weight: 500;
        font-size: 32px;
        letter-spacing: 0.01em;
        color: var(--ink-2);
      }

      /* Prikken nede til høyre er familiesignaturen — portalens kort har én
         per produkt, et produktkort har sin egen. */
      .mark {
        position: absolute;
        right: 96px;
        bottom: 88px;
        width: 32px;
        height: 32px;
        border-radius: 999px;
        background: var(--accent);
      }

      /* ── Kapittelvarianten (#68) ─────────────────────────────────────
         SAMME fil, samme identitet: kortet som sier hvilket kapittel en
         delt lenke peker på, er dette kortet med to SLOTTER fylt ut.

         Slottene er `[data-og-slot]`. Generatoren måler dem her — plass,
         skrift, farge og grunnlinje — og rastrerer bakgrunnen med teksten
         SKJULT. Teksten tegnes så per forespørsel, fordi den er forskjellig
         for 1189 kapitler × 8 språk. Endrer du en slotts skrift eller
         plassering, er det HER det gjøres; kjør generatoren etterpå.

         Åpne fila med `#chapter` i nettleseren for å se varianten. */
      .slots { display: none; }
      body.chapter { justify-content: space-between; padding: 80px 96px; }
      .chapter .wordmark { font-size: 48px; }
      .chapter .slots { display: block; }
      .chapter .domain { margin-top: 0; font-size: 28px; }
      .chapter .mark { bottom: 80px; }

      /* Bokstittelen får plass til TO linjer, og én linje står midtstilt i
         den samme kassa. Uten den reservasjonen ville «Ensimmäinen
         Mooseksen kirja» dyttet resten av kortet ned — og bakgrunnen er
         rastrert på forhånd, så den kan ikke flytte seg. */
      .slot-book {
        display: flex;
        align-items: center;
        min-height: 212px;
        font-family: 'Schibsted Grotesk';
        font-weight: 800;
        font-size: 96px;
        line-height: 1.1;
        letter-spacing: -0.02em;
        color: var(--ink);
      }
      .slot-chapter {
        margin-top: 8px;
        font-family: 'IBM Plex Mono';
        font-weight: 500;
        font-size: 40px;
        line-height: 1.3;
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <div class="wordmark">
      <span class="brand">FLOGVIT</span><span class="dot">.</span><span class="product">bible</span>
    </div>
    <div class="slots">
      <div class="slot-book" data-og-slot="book">Matteus</div>
      <div class="slot-chapter" data-og-slot="chapter">Kapittel 5</div>
    </div>
    <p class="domain">bible.flogvit.com</p>
    <span class="mark"></span>
    <script>
      // Bare for et menneske som åpner fila: generatoren setter klassen selv.
      if (location.hash === '#chapter') document.body.className = 'chapter';
    </script>
  </body>
</html>

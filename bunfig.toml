# mcp/ is its own package with its own dependencies and its own `bun test`
# (mcp/README.md). Without this, bibel's suite would run it too and fail in any
# checkout where mcp/node_modules is not installed — including bibel's deploy.
[test]
pathIgnorePatterns = ["mcp/**"]
# Keeps the suite off the network: the songs index is off unless a test asks (test/preload.ts).
preload = ["./test/preload.ts"]
